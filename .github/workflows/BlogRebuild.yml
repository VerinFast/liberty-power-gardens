name: Jekyll Rebuild

on:
  schedule:
    # Run daily at 8:00 AM UTC (4:00 AM EDT)
    - cron: '0 8 * * *'
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for posts published today
        id: changes
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "Checking for posts dated: $TODAY"
          if find _posts -name "${TODAY}-*" | grep -q .; then
            echo "Post(s) found for today!"
            find _posts -name "${TODAY}-*"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No posts dated today — checking for any unreleased posts..."
            ls -la _posts/
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Pages rebuild
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          # Create an empty commit to trigger GitHub Pages rebuild
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit --allow-empty -m "🤖 Trigger rebuild — new post published $(date -u +%Y-%m-%d)"
          git push
